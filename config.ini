[Settings]
# Путь к локальной папке, которую нужно синхронизировать
local_folder = ./local_folder

# Имя папки на Яндекс.Диске (должна существовать)
remote_folder = backup_folder

# Токен доступа к Яндекс.Диску (получите в Яндекс.Полигоне)
token = 

# Период синхронизации в секундах
sync_period = 10

# Путь к файлу лога
log_file = sync.log
